# Nginx 站点配置（guojici云平台）
# 配置说明：
# 1. 静态资源直接Nginx返回，不走PHP
# 2. 开启gzip压缩
# 3. 开启fastcgi缓存
# 4. 配置长连接
# 5. WebSocket支持（WebSSH、noVNC）

server {
    listen 80;
    listen 4561;
    server_name 192.168.3.2;
    
    # 站点根目录
    root /www/wwwroot/192.168.3.2_4561;
    index index.php index.html;
    
    # 客户端请求体最大大小
    client_max_body_size 50m;
    
    # 长连接配置
    keepalive_timeout 65;
    
    # ========== 静态资源优化 ==========
    # 图片、CSS、JS、字体等静态资源直接返回
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    
    # ========== noVNC静态资源 ==========
    location /novnc/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    
    # ========== WebSocket支持（WebSSH） ==========
    location /webssh/ {
        proxy_pass http://127.0.0.1:4561;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # ========== WebSocket支持（noVNC） ==========
    location /websockify/ {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # ========== PHP-FPM处理动态请求 ==========
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-4561.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # fastcgi缓存配置
        fastcgi_cache guojici_cache;
        fastcgi_cache_valid 200 5m;
        fastcgi_cache_valid 301 302 1m;
        fastcgi_cache_valid any 1m;
        
        # 不缓存POST请求和登录页面
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_bypass $http_cache_control;
        fastcgi_no_cache $http_pragma $http_authorization;
        
        # 超时配置
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        
        # 缓冲区大小
        fastcgi_buffer_size 64k;
        fastcgi_buffers 4 64k;
        fastcgi_busy_buffers_size 128k;
    }
    
    # ========== API接口 ==========
    location /api/ {
        fastcgi_pass unix:/tmp/php-cgi-4561.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # API接口不缓存（或根据需求配置）
        fastcgi_cache_bypass 1;
        fastcgi_no_cache 1;
    }
    
    # ========== 禁止访问敏感文件 ==========
    location ~ /\.(htaccess|git|svn|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ========== 错误页面 ==========
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root html;
    }
}