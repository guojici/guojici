; AI助手专用PHP-FPM进程池（ai_pool.conf）
; 独立进程池避免AI长连接阻塞正常业务请求

[ai_pool]
user = www
group = www
listen = /tmp/php-ai.sock
listen.owner = www
listen.group = www
listen.mode = 0660

; AI是长连接，用更多进程
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; AI请求耗时长，单进程处理请求数少一些
pm.max_requests = 500

; 慢请求日志
slowlog = /var/log/php-fpm/ai-slow.log
request_slowlog_timeout = 5

; 超时时间长一些（AI可能生成很久）
request_terminate_timeout = 300

; 环境变量
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp