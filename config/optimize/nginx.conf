# Nginx 优化配置
# 适用于 guojici云平台

user www www;

# worker进程数 = CPU核数
worker_processes 8;

# 最大文件描述符数
worker_rlimit_nofile 65535;

events {
    # 每个worker最大连接数
    worker_connections 10240;
    
    # 事件模型：Linux推荐epoll
    use epoll;
    
    # 开启连接复用
    multi_accept on;
}

http {
    # 开启sendfile零拷贝
    sendfile on;
    
    # 开启tcp_nopush，合并TCP包
    tcp_nopush on;
    
    # 开启tcp_nodelay，低延迟
    tcp_nodelay on;
    
    # 长连接超时时间（秒）
    keepalive_timeout 65;
    
    # 每个连接最大请求数
    keepalive_requests 100;
    
    # 客户端请求体最大大小
    client_max_body_size 50m;
    
    # 开启gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    gzip_comp_level 6;
    
    # 开启fastcgi缓存
    fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=guojici_cache:10m max_size=100m inactive=60m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/guojici_access.log main;
    error_log /var/log/nginx/guojici_error.log warn;
    
    # 包含站点配置
    include /usr/local/nginx/conf/vhost/*.conf;
}