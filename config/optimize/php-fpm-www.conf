; PHP-FPM 进程池优化配置（www.conf）
; 适用于 8核服务器，内存16GB以上

[www]
user = www
group = www
listen = /tmp/php-cgi-4561.sock
listen.owner = www
listen.group = www
listen.mode = 0660

; 进程模式：高并发推荐 static
pm = static

; 最大进程数 = CPU核数 * 2 ~ CPU核数 * 4
; 8核服务器推荐：16-32
pm.max_children = 24

; 启动时进程数
pm.start_servers = 16

; 最小空闲进程数
pm.min_spare_servers = 8

; 最大空闲进程数
pm.max_spare_servers = 24

; 单进程最大处理请求数，防止内存泄漏
pm.max_requests = 1000

; 慢请求日志，定位慢接口（超过1秒记录）
slowlog = /var/log/php-fpm/4561-slow.log
request_slowlog_timeout = 1

; 请求超时时间
request_terminate_timeout = 60

; 环境变量
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP-FPM状态页面（可选，用于监控）
pm.status_path = /php-fpm-status
ping.path = /php-fpm-ping
ping.response = pong